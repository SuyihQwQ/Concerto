name: Test Full Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Minecraft 1.21.11 on dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Build all platform jars
        run: |
          chmod +x ./gradlew
          ./gradlew clean buildAll

      - name: Upload test build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: concerto-test-build-mc1.21.11-${{ github.run_number }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
